name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  client:
    name: Client (React/Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  server:
    name: Server (Node/Express)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run test
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret
          USDA_API_KEY: ci-test-key
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: ci-test-key
          AWS_SECRET_ACCESS_KEY: ci-test-secret
          S3_BUCKET: ci-test-bucket
          # MONGO_URI intentionally omitted — mongodb-memory-server should override it
          # in your Vitest setup file. If tests fail on DB connection, that's the signal
          # the setup file isn't doing the override and this needs a dummy value too.

  health-report-service:
    name: Health Report Service (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: health-report-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: health-report-service/requirements.txt

      - run: pip install -r requirements.txt
      - run: pip install ruff pytest   # skip if already in requirements.txt
      - run: ruff check .
      - run: pytest